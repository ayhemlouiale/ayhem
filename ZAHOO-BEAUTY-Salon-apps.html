<style>
:root{--pink:#ed78ad;--purple:#8551c7;--deep:#7d3fa6;--gold:#c49a52;--ink:#49344f;--muted:#927d9b;--paper:#fffaff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 15% 10%,#f9e5f2 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#eee3ff 0,transparent 38%),linear-gradient(135deg,#fffafd,#fbf6ff);display:grid;place-items:center;padding:28px}
main{width:min(100%,520px);text-align:center}.brand{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;margin-bottom:30px}.logo{width:clamp(130px,35vw,190px);aspect-ratio:1;object-fit:contain;border-radius:50%;filter:drop-shadow(0 12px 22px #b96a8a30)}
h1{font-family:Georgia,serif;font-size:clamp(30px,7vw,42px);letter-spacing:2px;margin:4px 0;background:linear-gradient(90deg,#e65c9b,#9654d6,#d94f9c,#7651cb);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brandGlow 5s ease-in-out infinite}
.handle{font-size:14px;letter-spacing:1.5px;direction:ltr;background:linear-gradient(90deg,#d94f9c,#8551c7,#e56ba8);background-size:250% 250%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;animation:brandGlow 4s ease-in-out infinite reverse}
@keyframes brandGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.rule{width:76px;height:2px;background:linear-gradient(90deg,transparent,#d77bb0,#9360cb,transparent);margin:20px auto 24px}
.accounts{display:grid;gap:14px}.account{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);background:#ffffffeb;border:1px solid #e6d4ee;border-radius:18px;padding:17px 20px;box-shadow:0 8px 24px #8551c70d;transition:transform .2s,border-color .2s,box-shadow .2s}.account:hover{transform:translateY(-3px);border-color:#c99bdc;box-shadow:0 12px 28px #8551c71c}.icon{width:56px;height:56px;flex:0 0 56px;border-radius:17px;display:grid;place-items:center;overflow:hidden;box-shadow:0 5px 13px #4b28501a}.icon svg{width:31px;height:31px;display:block}.icon img{width:100%;height:100%;display:block;object-fit:cover}
/* Recognizable current app-icon treatments using the platforms' familiar brand marks and colors */
.snap-icon{background:#fffc00}.snap-icon svg{width:34px;height:34px}.snap-icon path{fill:#fff;stroke:#111;stroke-width:.75;stroke-linejoin:round}
.insta-icon{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}.insta-icon svg{fill:none;stroke:#fff;stroke-width:1.9}.insta-icon .dot{fill:#fff;stroke:none}
.fb-icon{background:#0866ff;border-radius:50%}.fb-icon svg{width:34px;height:34px;fill:#fff}
.account span{font-size:16px;font-weight:700;direction:ltr;text-align:left}.arrow{margin-right:auto;color:#a36ac4;font-size:22px}.footer{margin-top:26px;color:#a18aa9;font-size:12px;letter-spacing:1px}

/* Professional layout, theme switch and direct phone calls */
body{display:block;padding:22px 16px 34px;transition:background .35s,color .35s}
main{margin:0 auto;padding-top:2px}
.topbar{display:flex;justify-content:flex-start;margin:0 0 18px}
.theme-toggle{display:inline-flex;align-items:center;gap:9px;border:1px solid #e4cce9;border-radius:999px;padding:10px 15px;background:#fff;color:#654477;font:700 13px Tahoma,Arial,sans-serif;cursor:pointer;box-shadow:0 5px 18px #8551c714;transition:.25s}
.theme-toggle:hover{transform:translateY(-2px);box-shadow:0 8px 22px #8551c72a}
.theme-symbol{font-size:18px;line-height:1}
.welcome{margin:9px 0 0;color:#9661a9;font-size:clamp(17px,4vw,21px);font-weight:700;letter-spacing:.3px}
.phones{display:grid;gap:11px;margin:0 0 24px}
.section-title{font-size:15px;color:var(--muted);margin:0 0 2px;font-weight:700}
.phone-card{display:flex;align-items:center;gap:14px;padding:14px 17px;border-radius:17px;text-decoration:none;background:#fff;border:1px solid #e8dce9;box-shadow:0 7px 22px #4d31500c;transition:transform .2s,box-shadow .2s;direction:rtl}
.phone-card:hover{transform:translateY(-2px);box-shadow:0 11px 26px #4d31501a}
.call-icon{width:46px;height:46px;display:grid;place-items:center;flex:0 0 46px;border-radius:14px;background:#19a957;color:#fff;box-shadow:0 5px 14px #19a95735}
.call-icon svg{width:25px;height:25px;fill:currentColor}
.phone-content{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:1;min-width:0}
.phone-number{direction:ltr;unicode-bidi:isolate;font-size:clamp(17px,4vw,20px);font-weight:800;color:#171717;letter-spacing:.5px;white-space:nowrap;position:relative;display:inline-block;background:linear-gradient(110deg,#111 0%,#111 38%,#9b9b9b 46%,#fff 50%,#9b9b9b 54%,#111 62%,#111 100%);background-size:240% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:phoneShine 3.8s ease-in-out infinite}
@keyframes phoneShine{0%,15%{background-position:100% 0}75%,100%{background-position:-100% 0}}
.call-label{color:#16994c;font-size:14px;font-weight:800;white-space:nowrap}
.phone-arrow{color:#20a65b;font-size:20px}
.second-phone .call-icon{background:#242124;color:#fff}
.second-phone .call-label,.second-phone .phone-arrow{color:#555}
.second-phone .phone-number{animation-delay:1.2s}
/* Dark theme */
body.dark-mode{--ink:#f4eaf7;--muted:#c2a9cc;--paper:#21182a;background:radial-gradient(ellipse at 15% 10%,#422345 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#292044 0,transparent 40%),linear-gradient(135deg,#17121d,#21182b);color:var(--ink)}
.dark-mode .account,.dark-mode .phone-card{background:#2b2233eF;border-color:#51405c;box-shadow:0 8px 24px #0003;color:#f6edf8}
.dark-mode .theme-toggle{background:#30243a;border-color:#624b70;color:#f4eafa}
.dark-mode .welcome{color:#e4a4df}
.dark-mode .phone-number{background-image:linear-gradient(110deg,#fff 0%,#fff 38%,#999 46%,#fff 50%,#999 54%,#fff 62%,#fff 100%)}
.dark-mode .call-label,.dark-mode .phone-arrow{color:#75e5a0}
.dark-mode .second-phone .call-label,.dark-mode .second-phone .phone-arrow{color:#d8cbdc}
@media(max-width:380px){.phone-card{gap:10px;padding:12px}.call-icon{width:42px;height:42px;flex-basis:42px}.phone-content{gap:7px}.phone-number{font-size:16px}}
@media(prefers-reduced-motion:reduce){.phone-number{animation:none}}

/* Phone menu: numbers appear only after tapping the button */
.phone-menu-button{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:15px 20px;border:1px solid #d9a5dc;border-radius:18px;background:linear-gradient(120deg,#f5d7ee,#e7c9f4);color:#54245f;font:inherit;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 8px 22px #b66bb52b;transition:transform .2s,box-shadow .2s}
.phone-menu-button:active{transform:scale(.98)}
.phone-menu-icon{font-size:23px}.phone-menu-chevron{font-size:22px;transition:transform .2s}.phone-menu-button[aria-expanded="true"] .phone-menu-chevron{transform:rotate(180deg)}
.phone-options{display:grid;gap:11px;margin-top:13px}.phone-options[hidden]{display:none}
.phone-option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-radius:16px;background:#fff;border:1px solid #e7dce9;color:#17121d;text-decoration:none;box-shadow:0 6px 18px #00000012}
.phone-option-number{font-weight:900;letter-spacing:.4px;background:linear-gradient(100deg,#111 0%,#111 35%,#aaa 48%,#fff 52%,#777 58%,#111 72%);background-size:230% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:phoneShine 4s ease-in-out infinite}
.phone-option-call{display:inline-flex;align-items:center;gap:6px;background:#159447;color:#fff;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:900;white-space:nowrap}
.phone-option-call svg{width:17px;height:17px;fill:currentColor}
.dark-mode .phone-menu-button{background:linear-gradient(120deg,#422847,#342341);border-color:#75517e;color:#fff;box-shadow:0 8px 24px #0004}
.dark-mode .phone-option{background:#302638;border-color:#584660;color:#fff;box-shadow:0 8px 22px #0004}
.dark-mode .phone-option-number{background-image:linear-gradient(100deg,#fff 0%,#fff 35%,#999 48%,#fff 52%,#aaa 58%,#fff 72%)}
@media(prefers-reduced-motion:reduce){.phone-option-number{animation:none}}


/* Animated flowing background: soft pink and violet in light mode, deep plum in dark mode */
body{position:relative;isolation:isolate;background:transparent!important;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-35%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 18% 22%,rgba(248,174,216,.78) 0,transparent 34%),radial-gradient(ellipse at 78% 28%,rgba(191,151,244,.72) 0,transparent 36%),radial-gradient(ellipse at 52% 82%,rgba(255,218,236,.86) 0,transparent 38%),linear-gradient(125deg,#fff7fc,#f8efff,#fff2f8,#f0e8ff);background-size:150% 150%;animation:ambientFlow 18s ease-in-out infinite alternate;will-change:background-position,transform}
body.dark-mode::before{background:radial-gradient(ellipse at 18% 22%,rgba(111,49,105,.62) 0,transparent 36%),radial-gradient(ellipse at 78% 28%,rgba(74,57,133,.68) 0,transparent 38%),radial-gradient(ellipse at 52% 82%,rgba(91,43,83,.55) 0,transparent 40%),linear-gradient(125deg,#100d17,#21152b,#171326,#29172d);background-size:150% 150%}
@keyframes ambientFlow{0%{background-position:0% 15%;transform:translate3d(-1.5%, -1%,0) scale(1)}50%{background-position:100% 70%;transform:translate3d(1.5%,1%,0) scale(1.035)}100%{background-position:15% 100%;transform:translate3d(-.5%,1.5%,0) scale(1.015)}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
